name: Set up build environment (no Nix)
description: >
  Rust + Flutter + rinf toolchain for the platforms where the Nix devshell
  cannot be used: Windows (no native Nix), macOS/iOS (need the runner's
  Xcode), and the portable Linux release (binaries linked inside the Nix
  devshell carry /nix/store interpreter paths and only run on Nix systems).
  Keep `flutter-version` in lockstep with the flake's nixpkgs Flutter.
  Expects this repo checked out at ./haqor and an `assets-db` artifact uploaded
  earlier in the run.

inputs:
  flutter-version:
    description: Flutter SDK version (match the Nix devshell's Flutter)
    default: "3.38.3"
  rust-targets:
    description: Extra Rust targets to install (comma separated)
    default: ""

runs:
  using: composite
  steps:
    - name: Identify Rust target set
      id: targets
      shell: bash
      env:
        RUST_TARGETS: ${{ inputs.rust-targets }}
      run: |
        set -euo pipefail
        normalized="$(printf '%s' "$RUST_TARGETS" | tr ',' '\n' | sed '/^[[:space:]]*$/d; s/[[:space:]]//g' | sort | paste -sd, -)"
        if command -v sha256sum >/dev/null 2>&1; then
          digest="$(printf '%s' "$normalized" | sha256sum | cut -d' ' -f1)"
        else
          digest="$(printf '%s' "$normalized" | shasum -a 256 | cut -d' ' -f1)"
        fi
        printf 'id=%s\n' "$digest" >> "$GITHUB_OUTPUT"

    - name: Cache rustup and cargo homes
      uses: actions/cache@v4
      with:
        path: |
          ~/.rustup
          ~/.cargo
        key: rust-home-v3-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.targets.outputs.id }}-${{ hashFiles('haqor/rust-toolchain.toml') }}-${{ hashFiles('haqor/pubspec.lock', 'haqor/Cargo.lock', 'haqor/tool/build-web.sh') }}
        restore-keys: |
          rust-home-v3-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.targets.outputs.id }}-${{ hashFiles('haqor/rust-toolchain.toml') }}-

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@main

    - name: Install rinf_cli
      shell: bash
      # Version requirement mirrors the rinf constraint in pubspec.yaml.
      run: cargo binstall --no-confirm rinf_cli --version '^8.6'

    - name: Identify native Rust compiler and SDK
      id: compiler
      shell: bash
      run: |
        set -euo pipefail
        context="$(rustup run stable rustc -Vv; rinf --version 2>/dev/null || true)
        runner=${{ runner.os }}-${{ runner.arch }}
        image=${ImageVersion:-unknown}"
        if [[ "${{ runner.os }}" == "macOS" ]]; then
          context+="$(xcodebuild -version; xcrun --sdk macosx --show-sdk-version; xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || true)"
        elif [[ "${{ runner.os }}" == "Linux" ]]; then
          context+="$(clang --version; cmake --version | head -1)"
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          digest="$(printf '%s' "$context" | sha256sum | cut -d' ' -f1)"
        else
          digest="$(printf '%s' "$context" | shasum -a 256 | cut -d' ' -f1)"
        fi
        printf 'id=%s\n' "$digest" >> "$GITHUB_OUTPUT"

    - name: Cache compiled Rust outputs
      uses: actions/cache@v4
      with:
        path: |
          haqor/build/**/plugins/rinf/cargokit_build
          haqor/build/**/rinf.build
          haqor/target
        key: rust-build-v3-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.targets.outputs.id }}-${{ inputs.flutter-version }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('haqor/pubspec.lock', 'haqor/Cargo.lock', 'haqor/Cargo.toml', 'haqor/native/hub/Cargo.toml', 'haqor/tool/build-web.sh', 'haqor/.github/actions/setup-build/action.yml') }}
        restore-keys: |
          rust-build-v3-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.targets.outputs.id }}-${{ inputs.flutter-version }}-${{ steps.compiler.outputs.id }}-

    - name: Install bundled databases
      uses: actions/download-artifact@v4
      with:
        name: assets-db
        path: haqor/assets/db

    - name: Fetch Dart dependencies and generate bindings
      shell: bash
      working-directory: haqor
      run: |
        flutter pub get
        bash tool/generate-bindings.sh
