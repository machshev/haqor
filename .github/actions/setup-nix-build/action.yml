name: Set up Nix build environment
description: >
  Toolchain for Linux-hosted app builds, provided by this repo's Nix flake so
  CI matches the dev environment exactly (Flutter, JDK, Android SDK/NDK,
  rustup, GTK libs — all pinned by flake.lock). Expects this repo checked out
  at ./haqor. Database installation is enabled by default and expects an
  `assets-db` artifact uploaded earlier in the run.

inputs:
  rust-targets:
    description: Extra Rust targets to install (space separated)
    default: ""
  install-database:
    description: Download the bundled database artifact into assets/db
    default: "true"
  gradle-cache:
    description: Restore Gradle's build cache for Android jobs
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Nix
      # cache.nixos.org supplies the pinned store; reserve GitHub cache
      # space for compiled outputs below.
      uses: nixbuild/nix-quick-install-action@v30
      with:
        github_access_token: ${{ github.token }}
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true

    - name: Configure Kotlin compilation
      shell: bash
      run: echo 'ORG_GRADLE_PROJECT_kotlin.compiler.execution.strategy=in-process' >> "$GITHUB_ENV"

    - name: Restore Gradle build cache
      if: ${{ inputs.gradle-cache == 'true' }}
      uses: gradle/actions/setup-gradle@v4

    - name: Cache rustup and cargo homes
      uses: actions/cache@v4
      with:
        path: |
          ~/.rustup
          ~/.cargo
        key: rust-home-v3-nix-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-targets }}-${{ hashFiles('haqor/rust-toolchain.toml', 'haqor/flake.nix', 'haqor/flake.lock') }}-${{ hashFiles('haqor/pubspec.lock', 'haqor/Cargo.lock', 'haqor/tool/build-web.sh') }}
        restore-keys: |
          rust-home-v3-nix-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-targets }}-${{ hashFiles('haqor/rust-toolchain.toml', 'haqor/flake.nix', 'haqor/flake.lock') }}-

    - name: Bootstrap Rust toolchain and rinf_cli
      shell: bash
      working-directory: haqor
      # The devshell provides rustup (the rinf plugin requires it) but the
      # toolchain itself lives in ~/.rustup. On the very first `nix develop`
      # the flake shellHook runs before any toolchain exists, so its
      # rinf_cli/rinf-gen steps fail noisily but harmlessly — the command
      # below then installs everything they needed.
      run: |
        nix develop --command bash -c '
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          targets="${{ inputs.rust-targets }}"
          if [ -n "$targets" ]; then
            rustup target add $targets
          fi
          command -v rinf >/dev/null || cargo install rinf_cli --locked
        '

    - name: Identify Nix Rust compiler and SDK
      id: compiler
      shell: bash
      working-directory: haqor
      run: |
        set -euo pipefail
        context="$(nix develop --command bash -c 'rustup run stable rustc -Vv; rinf --version 2>/dev/null || true; printf "\\nNDK=%s\\nFlutter=%s\\n" "$ANDROID_NDK_ROOT" "$FLUTTER_ROOT"')"
        printf '%s' "$context" | sha256sum | cut -d' ' -f1 | sed 's/^/id=/' >> "$GITHUB_OUTPUT"

    - name: Cache compiled Rust outputs
      uses: actions/cache@v4
      with:
        path: |
          haqor/build/rinf/build
          haqor/build/**/plugins/rinf/cargokit_build
          haqor/build/**/rinf.build
          haqor/target
        key: rust-build-v3-nix-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-targets }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('haqor/pubspec.lock', 'haqor/Cargo.lock', 'haqor/Cargo.toml', 'haqor/native/hub/Cargo.toml', 'haqor/tool/build-web.sh', 'haqor/flake.nix', 'haqor/flake.lock', 'haqor/.github/actions/setup-nix-build/action.yml') }}
        restore-keys: |
          rust-build-v3-nix-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-targets }}-${{ steps.compiler.outputs.id }}-

    - name: Install bundled databases
      if: ${{ inputs.install-database == 'true' }}
      uses: actions/download-artifact@v4
      with:
        name: assets-db
        path: haqor/assets/db

    - name: Prepare empty database asset directory
      if: ${{ inputs.install-database != 'true' }}
      shell: bash
      run: mkdir -p haqor/assets/db

    - name: Fetch Dart dependencies and generate bindings
      shell: bash
      working-directory: haqor
      run: nix develop --command bash -c 'flutter pub get && bash tool/generate-bindings.sh'
