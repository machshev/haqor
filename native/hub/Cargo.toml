[package]
# Do not change the name of this crate.
name = "hub"
version = "0.1.0"
edition = "2024"

[lib]
# `lib` is required for non-library targets,
# such as tests and benchmarks.
# `cdylib` is for Linux, Android, Windows, and web.
# `staticlib` is for iOS and macOS.
crate-type = ["lib", "cdylib", "staticlib"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"

[dependencies]
anyhow = "1.0"
rinf = "8.6.0"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.0", features = ["rt", "macros", "time"] }
async-trait = "0.1.87"
messages = "0.3.1"

# Uncomment below to target the web.
tokio_with_wasm = { version = "0.10.1", features = ["rt", "macros", "time"] }
wasm-bindgen = "0.2.100"
# Keep app releases on the published core API. Local development can opt into
# a checkout with the ignored `.cargo/config.toml` patch documented in
# `doc/LOCAL_CORE_DEVELOPMENT.md`.
# Never enable the `embedded` feature here: the app ships the databases as
# Flutter assets and opens them file-backed via `Bible::open`.
haqor-core = { version = "=0.9.17", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

# Pinned-certificate HTTPS for LAN sync. The browser build never syncs, and
# ring would need a wasm C toolchain, so it is native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ring = "0.17.14"
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
